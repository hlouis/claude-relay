<!-- Attack fixture: SVG with inline <script>. Browsers execute scripts in
     SVGs served as image/svg+xml under same-origin direct navigation,
     so the response MUST carry CSP sandbox to neutralize it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 30" width="200" height="60">
  <text x="5" y="20" font-family="sans-serif" font-size="14">SVG with script</text>
  <script>try { parent.postMessage({ stolen: document.cookie }, '*'); } catch(e){}</script>
</svg>
